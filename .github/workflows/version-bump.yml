name: Version Bump

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New version (e.g., 1.2.3)'
        required: true
        type: string
      create_tag:
        description: 'Create and push tag'
        required: true
        type: boolean
        default: false

jobs:
  bump-version:
    name: Bump Version
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update Python version
        working-directory: python
        run: |
          sed -i "s/version = \".*\"/version = \"${{ inputs.version }}\"/" pyproject.toml
          cat pyproject.toml

      - name: Update Go version (create VERSION file)
        working-directory: go
        run: |
          echo "${{ inputs.version }}" > VERSION
          cat VERSION

      - name: Update Bazel version
        run: |
          sed -i "s/version = \".*\"/version = \"${{ inputs.version }}\"/" MODULE.bazel
          cat MODULE.bazel

      - name: Commit version changes
        run: |
          git add .
          git commit -m "chore: bump version to ${{ inputs.version }}"
          git push

      - name: Create and push tag
        if: inputs.create_tag
        run: |
          TAG_NAME="v${{ inputs.version }}"
          git tag -a "$TAG_NAME" -m "Release version ${{ inputs.version }}"
          git push origin "$TAG_NAME"
          echo "Created and pushed tag: $TAG_NAME"

